<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartShift - My Availability</title>
    <link rel="stylesheet" href="../assets/css/dashboard.css" />
  </head>
  <body>
    <div class="dashboard-container">
      <aside class="sidebar">
        <div class="logo"><h2>SmartShift</h2></div>
        <nav class="nav-menu">
          <a href="dashboard.html" class="nav-link">Overview</a>
          <a href="my-schedule.html" class="nav-link">My schedule</a>
          <a href="my-availability.html" class="nav-link active"
            aria-current="page">My availability</a
          >
        </nav>
        <div class="user-profile">
          <div class="user-info">
            <span class="user-name" id="userName">Loading...</span>
            <span class="user-role" id="userRole">Loading...</span>
          </div>
          <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
      </aside>

      <main class="main-content">
        <header class="top-bar">
          <div>
            <p class="page-eyebrow">Crew workspace</p>
            <h1>My availability</h1>
          </div>
          <div class="branch-info">
            <span>Welcome, <strong id="topBarName">Loading...</strong></span>
          </div>
        </header>

        <section class="avail-form">
          <h2 id="formTitle">Add availability</h2>
          <form id="availForm">
            <input type="hidden" id="avail_id" />

            <label for="day_of_week">Day of the week</label>
            <select id="day_of_week" required>
              <option value="Monday">Monday</option>
              <option value="Tuesday">Tuesday</option>
              <option value="Wednesday">Wednesday</option>
              <option value="Thursday">Thursday</option>
              <option value="Friday">Friday</option>
              <option value="Saturday">Saturday</option>
              <option value="Sunday">Sunday</option>
            </select>

            <div class="availability-row">
              <label for="start_time">
                Start time
                <input type="time" id="start_time" required />
              </label>
              <label for="end_time">
                End time
                <input type="time" id="end_time" required />
              </label>
            </div>

            <div class="availability-row">
              <label for="valid_from">
                Valid from
                <input type="date" id="valid_from" required />
              </label>
              <label for="valid_to">
                Valid to
                <input type="date" id="valid_to" required />
              </label>
            </div>
            <small class="availability-hint">
              Tip: You can set the end date several months ahead for a regular
              availability pattern.
            </small>

            <button
              type="submit"
              class="btn-primary"
              id="submitBtn"
            >
              Submit Availability
            </button>
            <button
              type="button"
              class="btn-secondary"
              onclick="cancelEdit()"
              id="cancelBtn"
              hidden
            >
              Cancel Edit
            </button>
          </form>
          <div id="message" class="status-message" role="status" aria-live="polite"></div>
        </section>

        <h2>Submitted availability</h2>
        <div id="avail-list">
          <p>Loading availability...</p>
        </div>
      </main>
    </div>

    <script src="../assets/js/api-config.js"></script>
    <script>
      const API_URL = window.SMARTSHIFT_API_URL;
      const token = sessionStorage.getItem("access_token");
      const user = JSON.parse(sessionStorage.getItem("user"));

      if (!token || !user) window.location.href = "index.html";

      document.getElementById("userName").textContent = user.full_name;
      document.getElementById("userRole").textContent =
        user.role === "employee" ? "Crew" : "Manager";
      document.getElementById("topBarName").textContent = user.full_name;

      function formatAvailabilityTime(value) {
        const [hourText, minute] = value.split(":");
        const hour = Number(hourText);
        const period = hour >= 12 ? "PM" : "AM";
        return `${hour % 12 || 12}:${minute} ${period}`;
      }

      // FETCH AVAILABILITY
      async function fetchAvailability() {
        const container = document.getElementById("avail-list");
        try {
          const response = await fetch(`${API_URL}/availability/my`, {
            headers: { Authorization: `Bearer ${token}` },
          });
          const data = await response.json();

          if (data.length === 0) {
            container.innerHTML =
              "<p style='color:#666;'>Wala ka pang naisubmit na availability.</p>";
            return;
          }

          let html = `<table class="avail-table">
            <thead><tr><th>Day</th><th>Time</th><th>Validity</th><th>Actions</th></tr></thead><tbody>`;

          data.forEach((a) => {
            const start = a.start_time.substring(0, 5);
            const end = a.end_time.substring(0, 5);
            const displayStart = formatAvailabilityTime(start);
            const displayEnd = formatAvailabilityTime(end);
            html += `<tr>
              <td><strong>${a.day_of_week}</strong></td>
              <td>${displayStart} - ${displayEnd}</td>
              <td>${a.valid_from} to ${a.valid_to}</td>
              <td>
                <button class="btn-edit" onclick="editAvailability(${a.id}, '${a.day_of_week}', '${start}', '${end}', '${a.valid_from}', '${a.valid_to}')">Edit</button>
                <button class="btn-delete" onclick="deleteAvailability(${a.id})">Delete</button>
              </td>
            </tr>`;
          });
          html += `</tbody></table>`;
          container.innerHTML = html;
        } catch (error) {
          container.innerHTML = `<p class="empty-state is-error">Unable to load availability: ${error.message}</p>`;
        }
      }

      // SUBMIT (ADD OR UPDATE)
      document
        .getElementById("availForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const msgBox = document.getElementById("message");
          const avail_id = document.getElementById("avail_id").value;

          const payload = {
            day_of_week: document.getElementById("day_of_week").value,
            start_time: document.getElementById("start_time").value + ":00",
            end_time: document.getElementById("end_time").value + ":00",
            valid_from: document.getElementById("valid_from").value,
            valid_to: document.getElementById("valid_to").value,
          };

          // Kung may avail_id, PUT (Update). Kung wala, POST (Create).
          const url = avail_id
            ? `${API_URL}/availability/${avail_id}`
            : `${API_URL}/availability/`;
          const method = avail_id ? "PUT" : "POST";

          try {
            const response = await fetch(url, {
              method: method,
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify(payload),
            });
            const data = await response.json();

            if (response.ok) {
              msgBox.textContent = avail_id
                ? "✅ Availability updated!"
                : "✅ Availability saved!";
              cancelEdit(); // I-reset ang form
              msgBox.textContent = avail_id
                ? "Availability updated."
                : "Availability saved.";
              msgBox.className = "status-message is-success";
              fetchAvailability();
            } else {
              msgBox.textContent = "❌ " + (data.detail || "Failed to save");
              msgBox.className = "status-message is-error";
            }
          } catch (error) {
            msgBox.textContent = "❌ Error: " + error.message;
            msgBox.className = "status-message is-error";
          }
        });

      // EDIT FUNCTION
      function editAvailability(id, day, start, end, vFrom, vTo) {
        document.getElementById("avail_id").value = id;
        document.getElementById("day_of_week").value = day;
        document.getElementById("start_time").value = start;
        document.getElementById("end_time").value = end;
        document.getElementById("valid_from").value = vFrom;
        document.getElementById("valid_to").value = vTo;

        document.getElementById("formTitle").textContent =
          "Edit availability";
        document.getElementById("submitBtn").textContent =
          "Update Availability";
        document.getElementById("cancelBtn").hidden = false;

        window.scrollTo(0, 0); // Scroll pataas
      }

      // CANCEL EDIT
      function cancelEdit() {
        document.getElementById("availForm").reset();
        document.getElementById("avail_id").value = "";
        document.getElementById("formTitle").textContent =
          "Add availability";
        document.getElementById("submitBtn").textContent =
          "Submit Availability";
        document.getElementById("cancelBtn").hidden = true;
        document.getElementById("message").textContent = "";
      }

      // DELETE FUNCTION
      async function deleteAvailability(id) {
        if (!confirm("Sigurado ka bang gusto mong i-delete ito?")) return;

        try {
          const response = await fetch(`${API_URL}/availability/${id}`, {
            method: "DELETE",
            headers: { Authorization: `Bearer ${token}` },
          });
          if (response.ok) {
            fetchAvailability();
          } else {
            alert("❌ Failed to delete.");
          }
        } catch (error) {
          alert(`❌ Error: ${error.message}`);
        }
      }

      function logout() {
        sessionStorage.removeItem("access_token");
        sessionStorage.removeItem("user");
        window.location.href = "index.html";
      }

      fetchAvailability();
    </script>
    <script src="../assets/js/schedule-notifications.js?v=schedule-ack-1"></script>
  </body>
</html>
