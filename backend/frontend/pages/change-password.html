<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartShift - Change Password</title>
    <link rel="stylesheet" href="../assets/css/dashboard.css" />
  </head>
  <body>
    <div class="dashboard-container">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <div class="logo"><h2>SmartShift</h2></div>
        <nav class="nav-menu">
          <a href="dashboard.html" class="nav-link" id="homeLink">Overview</a>
          <a href="head-dashboard.html" class="nav-link head-only"
            >Manager assignments</a
          >

          <!-- Manager links (hidden for crew) -->
          <a href="stations.html" class="nav-link manager-only">Stations</a>
          <a href="absences.html" class="nav-link">Absences</a>
          <a href="crew-management.html" class="nav-link manager-only"
            >Crew management</a
          >

          <!-- Crew links -->
          <a href="my-schedule.html" class="nav-link crew-only">My schedule</a>
          <a href="my-availability.html" class="nav-link crew-only"
            >My availability</a
          >

          <a href="change-password.html" class="nav-link active">Change password</a>
        </nav>
        <div class="user-profile">
          <div class="user-info">
            <span class="user-name" id="userName">Loading...</span>
            <span class="user-role" id="userRole">Loading...</span>
          </div>
          <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
      </aside>

      <!-- MAIN CONTENT -->
      <main class="main-content">
        <header class="top-bar">
          <div>
            <p class="page-eyebrow">Account security</p>
            <h1>Change password</h1>
          </div>
          <div class="branch-info">
            <span>Welcome, <strong id="topBarName">Loading...</strong></span>
          </div>
        </header>

        <!-- Password Form -->
        <section class="password-card">
          <h2>Update your password</h2>
          <p>
            Palitan ang iyong password para sa seguridad ng account mo.
          </p>

          <form id="changePasswordForm" class="password-form">
            <label for="old_password">Current password</label>
            <input
              type="password"
              id="old_password"
              required
              placeholder="Current password"
            />

            <label for="new_password">New password</label>
            <input
              type="password"
              id="new_password"
              required
              placeholder="At least 8 characters"
              minlength="8"
            />

            <label for="confirm_password">Confirm new password</label>
            <input
              type="password"
              id="confirm_password"
              required
              placeholder="Re-type new password"
            />

            <button type="submit" class="btn-primary">
              Change Password
            </button>
          </form>

          <div id="message" class="status-message" role="status" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <script src="../assets/js/api-config.js"></script>
    <script>
      const API_URL = window.SMARTSHIFT_API_URL;
      const token = sessionStorage.getItem("access_token");
      const user = JSON.parse(sessionStorage.getItem("user"));

      if (!token || !user) window.location.href = "index.html";

      // I-display ang pangalan
      document.getElementById("userName").textContent = user.full_name;
      document.getElementById("userRole").textContent =
        user.role === "employee"
          ? "Crew"
          : user.role === "head"
            ? "Head"
            : "Manager";
      document.getElementById("topBarName").textContent = user.full_name;
      const headOnly = document.querySelectorAll(".head-only");
      const managerOnly = document.querySelectorAll(".manager-only");
      if (user.role === "head") {
        document.getElementById("homeLink").href = "head-dashboard.html";
        headOnly.forEach((element) => (element.style.display = ""));
        managerOnly.forEach((element) => (element.style.display = "none"));
      } else {
        headOnly.forEach((element) => (element.style.display = "none"));
      }

      // ==========================================
      // RBAC LOGIC PARA MATAGO ANG MANAGER LINKS
      // ==========================================
      const crewOnly = document.querySelectorAll(".crew-only");
      if (user.role === "employee") {
        managerOnly.forEach((el) => (el.style.display = "none"));
        crewOnly.forEach((el) => (el.style.display = ""));
      } else {
        crewOnly.forEach((el) => (el.style.display = "none"));
      }

      // ==========================================
      // SUBMIT FORM
      // ==========================================
      document
        .getElementById("changePasswordForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const msgBox = document.getElementById("message");

          const oldPass = document.getElementById("old_password").value;
          const newPass = document.getElementById("new_password").value;
          const confirmPass = document.getElementById("confirm_password").value;

          if (newPass !== confirmPass) {
            msgBox.textContent = "❌ New passwords do not match!";
            msgBox.className = "status-message is-error";
            return;
          }

          try {
            const response = await fetch(`${API_URL}/auth/change-password`, {
              method: "POST",
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                old_password: oldPass,
                new_password: newPass,
              }),
            });

            const data = await response.json();

            if (response.ok) {
              msgBox.textContent = "✅ " + data.message + " Redirecting...";
              msgBox.className = "status-message is-success";
              setTimeout(() => {
                window.location.href =
                  user.role === "head" ? "head-dashboard.html" : "dashboard.html";
              }, 1500);
            } else {
              msgBox.textContent =
                "❌ " + (data.detail || "Failed to change password");
              msgBox.className = "status-message is-error";
            }
          } catch (error) {
            msgBox.textContent = "❌ Error: " + error.message;
            msgBox.className = "status-message is-error";
          }
        });

      function logout() {
        sessionStorage.removeItem("access_token");
        sessionStorage.removeItem("user");
        window.location.href = "index.html";
      }
    </script>
    <script src="../assets/js/schedule-notifications.js?v=schedule-ack-1"></script>
  </body>
</html>
