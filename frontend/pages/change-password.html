<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartShift - Change Password</title>
    <link rel="stylesheet" href="../assets/css/dashboard.css" />
  </head>
  <body>
    <div class="dashboard-container">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <div class="logo"><h2>smartshift</h2></div>
        <nav class="nav-menu">
          <a href="dashboard.html" class="nav-link">📊 Overview</a>

          <!-- Manager/Admin links (Employee-only JS script will hide these) -->
          <a href="branches.html" class="nav-link manager-only">🏬 Branches</a>
          <a href="stations.html" class="nav-link manager-only">🍳 Stations</a>
          <a href="crew-management.html" class="nav-link manager-only"
            >👥 Crew Management</a
          >

          <!-- Employee links -->
          <a href="#" class="nav-link employee-only">🕒 My Schedule</a>
          <a href="my-availability.html" class="nav-link employee-only"
            >✅ My Availability</a
          >

          <a href="change-password.html" class="nav-link active"
            >🔒 Change Password</a
          >
        </nav>
        <div class="user-profile">
          <div class="user-info">
            <span class="user-name" id="userName">Loading...</span>
            <span class="user-role" id="userRole">Loading...</span>
          </div>
          <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
      </aside>

      <!-- MAIN CONTENT -->
      <main class="main-content">
        <header class="top-bar">
          <h1>Change Password</h1>
          <div class="branch-info">
            <span>Welcome, <strong id="topBarName">User</strong></span>
          </div>
        </header>

        <!-- Password Form -->
        <div
          style="
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            border: 1px solid var(--border-light);
          "
        >
          <h2 style="margin-bottom: 5px">🔒 Update Password</h2>
          <p style="color: #666; margin-bottom: 20px">
            Palitan ang iyong password para sa seguridad ng account mo.
          </p>

          <form id="changePasswordForm">
            <label>Old Password</label>
            <input
              type="password"
              id="old_password"
              required
              placeholder="Current password"
            />

            <label>New Password</label>
            <input
              type="password"
              id="new_password"
              required
              placeholder="At least 6 characters"
              minlength="6"
            />

            <label>Confirm New Password</label>
            <input
              type="password"
              id="confirm_password"
              required
              placeholder="Re-type new password"
            />

            <button
              type="submit"
              class="btn-primary"
              style="margin-top: 15px; width: 100%"
            >
              Change Password
            </button>
          </form>

          <div id="message" style="margin-top: 15px; text-align: center"></div>
        </div>
      </main>
    </div>

    <script>
      const API_URL = "http://127.0.0.1:8000";
      const token = localStorage.getItem("access_token");
      const user = JSON.parse(localStorage.getItem("user"));

      if (!token || !user) window.location.href = "index.html";

      // I-display ang pangalan
      document.getElementById("userName").textContent = user.full_name;
      document.getElementById("userRole").textContent = user.role;
      document.getElementById("topBarName").textContent = user.full_name;

      // ==========================================
      // RBAC LOGIC PARA MATAGO ANG MANAGER LINKS
      // ==========================================
      const managerOnly = document.querySelectorAll(".manager-only");
      if (user.role === "employee") {
        managerOnly.forEach((el) => (el.style.display = "none"));
      }

      // ==========================================
      // SUBMIT FORM
      // ==========================================
      document
        .getElementById("changePasswordForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const msgBox = document.getElementById("message");

          const oldPass = document.getElementById("old_password").value;
          const newPass = document.getElementById("new_password").value;
          const confirmPass = document.getElementById("confirm_password").value;

          if (newPass !== confirmPass) {
            msgBox.textContent = "❌ New passwords do not match!";
            msgBox.style.color = "red";
            return;
          }

          try {
            const response = await fetch(`${API_URL}/auth/change-password`, {
              method: "POST",
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                old_password: oldPass,
                new_password: newPass,
              }),
            });

            const data = await response.json();

            if (response.ok) {
              msgBox.textContent = "✅ " + data.message + " Redirecting...";
              msgBox.style.color = "green";
              setTimeout(() => {
                window.location.href = "dashboard.html";
              }, 1500);
            } else {
              msgBox.textContent =
                "❌ " + (data.detail || "Failed to change password");
              msgBox.style.color = "red";
            }
          } catch (error) {
            msgBox.textContent = "❌ Error: " + error.message;
            msgBox.style.color = "red";
          }
        });

      function logout() {
        localStorage.removeItem("access_token");
        localStorage.removeItem("user");
        window.location.href = "index.html";
      }
    </script>
  </body>
</html>
