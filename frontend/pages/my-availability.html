<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartShift - My Availability</title>
    <link rel="stylesheet" href="../assets/css/dashboard.css" />
    <style>
      .avail-form {
        background: white;
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 20px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        max-width: 600px;
      }
      .avail-form label {
        display: block;
        margin: 10px 0 5px;
        font-weight: bold;
      }
      .avail-form input,
      .avail-form select {
        width: 100%;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box;
      }
      .avail-table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      }
      .avail-table th,
      .avail-table td {
        padding: 12px;
        border-bottom: 1px solid #eee;
        text-align: left;
        font-size: 14px;
      }
      .avail-table th {
        background: #f4f4f4;
      }
      .btn-edit {
        background: #f39c12;
        color: white;
        border: none;
        padding: 5px 10px;
        border-radius: 3px;
        cursor: pointer;
        margin-right: 5px;
      }
      .btn-delete {
        background: #e74c3c;
        color: white;
        border: none;
        padding: 5px 10px;
        border-radius: 3px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="dashboard-container">
      <aside class="sidebar">
        <div class="logo"><h2>smartshift</h2></div>
        <nav class="nav-menu">
          <a href="dashboard.html" class="nav-link">📊 Overview</a>
          <a href="my-availability.html" class="nav-link active"
            >✅ My Availability</a
          >
        </nav>
        <div class="user-profile">
          <div class="user-info">
            <span class="user-name" id="userName">Loading...</span>
            <span class="user-role" id="userRole">Loading...</span>
          </div>
          <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
      </aside>

      <main class="main-content">
        <header class="top-bar">
          <h1>My Availability</h1>
          <div class="branch-info">
            <span>Welcome, <strong id="topBarName">User</strong></span>
          </div>
        </header>

        <div class="avail-form">
          <h2 id="formTitle">➕ Add Availability</h2>
          <form id="availForm">
            <input type="hidden" id="avail_id" />
            <!-- Hidden input para sa Edit ID -->

            <label>Day of the Week</label>
            <select id="day_of_week" required>
              <option value="Monday">Monday</option>
              <option value="Tuesday">Tuesday</option>
              <option value="Wednesday">Wednesday</option>
              <option value="Thursday">Thursday</option>
              <option value="Friday">Friday</option>
              <option value="Saturday">Saturday</option>
              <option value="Sunday">Sunday</option>
            </select>

            <div style="display: flex; gap: 10px; margin-top: 10px">
              <div style="flex: 1">
                <label>Start Time</label>
                <input type="time" id="start_time" required />
              </div>
              <div style="flex: 1">
                <label>End Time</label>
                <input type="time" id="end_time" required />
              </div>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 10px">
              <div style="flex: 1">
                <label>Valid From</label>
                <input type="date" id="valid_from" required />
              </div>
              <div style="flex: 1">
                <label>Valid To</label>
                <input type="date" id="valid_to" required />
              </div>
            </div>
            <small style="color: #666; display: block; margin-top: 5px"
              >Tip: Pwede mong gawing 6 months ang Valid To kung regular
              ka.</small
            >

            <button
              type="submit"
              class="btn-primary"
              style="margin-top: 15px; width: 100%"
              id="submitBtn"
            >
              Submit Availability
            </button>
            <button
              type="button"
              onclick="cancelEdit()"
              id="cancelBtn"
              style="
                display: none;
                margin-top: 10px;
                width: 100%;
                background: #ccc;
                color: #333;
                border: none;
                padding: 10px;
                border-radius: 5px;
                cursor: pointer;
              "
            >
              Cancel Edit
            </button>
          </form>
          <div id="message" style="margin-top: 10px; text-align: center"></div>
        </div>

        <h2>📅 My Submitted Availability</h2>
        <div id="avail-list">
          <p>Loading availability...</p>
        </div>
      </main>
    </div>

    <script>
      const API_URL = "http://127.0.0.1:8000";
      const token = localStorage.getItem("access_token");
      const user = JSON.parse(localStorage.getItem("user"));

      if (!token || !user) window.location.href = "index.html";

      document.getElementById("userName").textContent = user.full_name;
      document.getElementById("userRole").textContent = user.role;
      document.getElementById("topBarName").textContent = user.full_name;

      // FETCH AVAILABILITY
      async function fetchAvailability() {
        const container = document.getElementById("avail-list");
        try {
          const response = await fetch(`${API_URL}/availability/my`, {
            headers: { Authorization: `Bearer ${token}` },
          });
          const data = await response.json();

          if (data.length === 0) {
            container.innerHTML =
              "<p style='color:#666;'>Wala ka pang naisubmit na availability.</p>";
            return;
          }

          let html = `<table class="avail-table">
            <thead><tr><th>Day</th><th>Time</th><th>Validity</th><th>Actions</th></tr></thead><tbody>`;

          data.forEach((a) => {
            const start = a.start_time.substring(0, 5);
            const end = a.end_time.substring(0, 5);
            html += `<tr>
              <td><strong>${a.day_of_week}</strong></td>
              <td>${start} - ${end}</td>
              <td>${a.valid_from} to ${a.valid_to}</td>
              <td>
                <button class="btn-edit" onclick="editAvailability(${a.id}, '${a.day_of_week}', '${start}', '${end}', '${a.valid_from}', '${a.valid_to}')">Edit</button>
                <button class="btn-delete" onclick="deleteAvailability(${a.id})">Delete</button>
              </td>
            </tr>`;
          });
          html += `</tbody></table>`;
          container.innerHTML = html;
        } catch (error) {
          container.innerHTML = `<p style="color:red;">❌ Error: ${error.message}</p>`;
        }
      }

      // SUBMIT (ADD OR UPDATE)
      document
        .getElementById("availForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const msgBox = document.getElementById("message");
          const avail_id = document.getElementById("avail_id").value;

          const payload = {
            day_of_week: document.getElementById("day_of_week").value,
            start_time: document.getElementById("start_time").value + ":00",
            end_time: document.getElementById("end_time").value + ":00",
            valid_from: document.getElementById("valid_from").value,
            valid_to: document.getElementById("valid_to").value,
          };

          // Kung may avail_id, PUT (Update). Kung wala, POST (Create).
          const url = avail_id
            ? `${API_URL}/availability/${avail_id}`
            : `${API_URL}/availability/`;
          const method = avail_id ? "PUT" : "POST";

          try {
            const response = await fetch(url, {
              method: method,
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify(payload),
            });
            const data = await response.json();

            if (response.ok) {
              msgBox.textContent = avail_id
                ? "✅ Availability updated!"
                : "✅ Availability saved!";
              msgBox.style.color = "green";
              cancelEdit(); // I-reset ang form
              fetchAvailability();
            } else {
              msgBox.textContent = "❌ " + (data.detail || "Failed to save");
              msgBox.style.color = "red";
            }
          } catch (error) {
            msgBox.textContent = "❌ Error: " + error.message;
            msgBox.style.color = "red";
          }
        });

      // EDIT FUNCTION
      function editAvailability(id, day, start, end, vFrom, vTo) {
        document.getElementById("avail_id").value = id;
        document.getElementById("day_of_week").value = day;
        document.getElementById("start_time").value = start;
        document.getElementById("end_time").value = end;
        document.getElementById("valid_from").value = vFrom;
        document.getElementById("valid_to").value = vTo;

        document.getElementById("formTitle").textContent =
          "✏️ Edit Availability";
        document.getElementById("submitBtn").textContent =
          "Update Availability";
        document.getElementById("cancelBtn").style.display = "block";

        window.scrollTo(0, 0); // Scroll pataas
      }

      // CANCEL EDIT
      function cancelEdit() {
        document.getElementById("availForm").reset();
        document.getElementById("avail_id").value = "";
        document.getElementById("formTitle").textContent =
          "➕ Add Availability";
        document.getElementById("submitBtn").textContent =
          "Submit Availability";
        document.getElementById("cancelBtn").style.display = "none";
        document.getElementById("message").textContent = "";
      }

      // DELETE FUNCTION
      async function deleteAvailability(id) {
        if (!confirm("Sigurado ka bang gusto mong i-delete ito?")) return;

        try {
          const response = await fetch(`${API_URL}/availability/${id}`, {
            method: "DELETE",
            headers: { Authorization: `Bearer ${token}` },
          });
          if (response.ok) {
            fetchAvailability();
          } else {
            alert("❌ Failed to delete.");
          }
        } catch (error) {
          alert(`❌ Error: ${error.message}`);
        }
      }

      function logout() {
        localStorage.removeItem("access_token");
        localStorage.removeItem("user");
        window.location.href = "index.html";
      }

      fetchAvailability();
    </script>
  </body>
</html>
