<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartShift - Stations</title>
    <link rel="stylesheet" href="../assets/css/dashboard.css" />
    <style>
      .station-form { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); max-width: 500px; }
      .station-form label { display: block; margin: 10px 0 5px; font-weight: bold; }
      .station-form input, .station-form select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
      .station-table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
      .station-table th, .station-table td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; font-size: 14px; }
      .station-table th { background: #f4f4f4; }
    </style>
  </head>
  <body>
    <div class="dashboard-container">
      <aside class="sidebar">
        <div class="logo"><h2>smartshift</h2></div>
        <nav class="nav-menu">
          <a href="dashboard.html" class="nav-link">📊 Overview</a>
          <a href="branches.html" class="nav-link">🏬 Branches</a>
          <a href="stations.html" class="nav-link active">🍳 Stations</a>
        </nav>
        <div class="user-profile">
          <div class="user-info">
            <span class="user-name" id="userName">Loading...</span>
            <span class="user-role" id="userRole">Loading...</span>
          </div>
          <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
      </aside>

      <main class="main-content">
        <header class="top-bar">
          <h1>Manage Stations</h1>
        </header>

        <div class="station-form">
          <h3>➕ Add New Station</h3>
          <form id="stationForm">
            <label>Select Branch</label>
            <select id="branch_id" required>
              <option value="">-- Loading branches... --</option>
            </select>

            <label>Station Name</label>
            <input type="text" id="station_name" required placeholder="e.g., Cashier, Kitchen, Grill" />

            <button type="submit" class="btn-primary" style="margin-top: 15px;">Add Station</button>
          </form>
          <div id="message" style="margin-top: 10px; font-weight: bold;"></div>
        </div>

        <h3>📋 List of Stations</h3>
        <div id="station-list">
          <p>Loading stations...</p>
        </div>
      </main>
    </div>

    <script>
      const API_URL = "http://127.0.0.1:8000";
      const token = localStorage.getItem("access_token");
      const user = JSON.parse(localStorage.getItem("user"));

      if (!token || !user) window.location.href = "index.html";

      document.getElementById("userName").textContent = user.full_name;
      document.getElementById("userRole").textContent = user.role;

      // 1. FETCH BRANCHES (Para sa Dropdown)
      async function fetchBranchesForDropdown() {
        const select = document.getElementById("branch_id");
        try {
          const response = await fetch(`${API_URL}/branches/`, {
            headers: { "Authorization": `Bearer ${token}` }
          });
          const branches = await response.json();
          
          select.innerHTML = '<option value="">-- Select Branch --</option>';
          branches.forEach(b => {
            select.innerHTML += `<option value="${b.id}">${b.name}</option>`;
          });
        } catch (error) {
          console.error("Error fetching branches:", error);
        }
      }

      // 2. FETCH STATIONS
      async function fetchStations() {
        const container = document.getElementById("station-list");
        try {
          const response = await fetch(`${API_URL}/stations/`, {
            headers: { "Authorization": `Bearer ${token}` }
          });
          const data = await response.json();

          if (data.length === 0) {
            container.innerHTML = "<p style='color:#666;'>No stations yet.</p>";
            return;
          }

          let html = `<table class="station-table">
            <thead><tr><th>ID</th><th>Branch</th><th>Station Name</th></tr></thead><tbody>`;
          
          data.forEach(s => {
            html += `<tr>
              <td>${s.id}</td>
              <td>${s.branch_name}</td>
              <td><strong>${s.name}</strong></td>
            </tr>`;
          });
          html += `</tbody></table>`;
          container.innerHTML = html;
        } catch (error) {
          container.innerHTML = `<p style="color:red;">❌ Error: ${error.message}</p>`;
        }
      }

      // 3. SUBMIT STATION
      document.getElementById("stationForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const msgBox = document.getElementById("message");

        const payload = {
          branch_id: parseInt(document.getElementById("branch_id").value),
          name: document.getElementById("station_name").value
        };

        try {
          const response = await fetch(`${API_URL}/stations/`, {
            method: "POST",
            headers: { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          const data = await response.json();

          if (response.ok) {
            msgBox.textContent = "✅ Station added successfully!";
            msgBox.style.color = "green";
            document.getElementById("station_name").value = ""; // Clear input
            fetchStations(); // I-refresh ang listahan
          } else {
            msgBox.textContent = "❌ Error: " + (data.detail || "Failed to add");
            msgBox.style.color = "red";
          }
        } catch (error) {
          msgBox.textContent = "❌ Error: " + error.message;
          msgBox.style.color = "red";
        }
      });

      function logout() {
        localStorage.removeItem("access_token");
        localStorage.removeItem("user");
        window.location.href = "index.html";
      }

      // INIT
      fetchBranchesForDropdown();
      fetchStations();
    </script>
  </body>
</html>
