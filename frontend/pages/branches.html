<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartShift - Branches</title>
    <link rel="stylesheet" href="../assets/css/dashboard.css" />
    <style>
      .branch-form {
        background: white;
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 20px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        max-width: 700px;
      }
      .branch-form label {
        display: block;
        margin: 10px 0 5px;
        font-weight: bold;
        font-size: 14px;
      }
      .branch-form input {
        width: 100%;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box;
      }
      .branch-table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      }
      .branch-table th,
      .branch-table td {
        padding: 12px;
        border-bottom: 1px solid #eee;
        text-align: left;
        font-size: 14px;
      }
      .branch-table th {
        background: #f4f4f4;
      }
    </style>
  </head>
  <body>
    <div class="dashboard-container">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <div class="logo"><h2>smartshift</h2></div>
        <nav class="nav-menu">
          <a href="dashboard.html" class="nav-link">📊 Overview</a>
          <a href="branches.html" class="nav-link active">🏬 Branches</a>
          <a href="team.html" class="nav-link">👥 Team</a>
        </nav>
        <div class="user-profile">
          <div class="user-info">
            <span class="user-name" id="userName">Loading...</span>
            <span class="user-role" id="userRole">Loading...</span>
          </div>
          <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
      </aside>

      <!-- MAIN CONTENT -->
      <main class="main-content">
        <header class="top-bar">
          <h1>Manage Branches</h1>
          <div class="branch-info">
            <span>Welcome, <strong id="topBarName">User</strong></span>
          </div>
        </header>

        <div class="welcome-section">
          <h2>🏬 Branch Setup</h2>
          <p>Add and manage your store branches and operating hours.</p>
        </div>

        <!-- FORM: Add Branch -->
        <div class="branch-form">
          <h3>➕ Add New Branch</h3>
          <form id="branchForm">
            <div style="margin-bottom: 15px">
              <label>Branch Name</label>
              <input
                type="text"
                id="branch_name"
                required
                placeholder="e.g., Main Branch - Manila"
              />
            </div>

            <div
              style="
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 15px;
                margin-bottom: 15px;
              "
            >
              <div>
                <label>Opening Time</label>
                <input type="time" id="opening_time" required />
              </div>
              <div>
                <label>Closing Time</label>
                <input type="time" id="closing_time" required />
              </div>
            </div>

            <div
              style="
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 15px;
                margin-bottom: 15px;
              "
            >
              <div>
                <label>Prep Time (Minutes before opening)</label>
                <input
                  type="number"
                  id="prep_time_minutes"
                  value="30"
                  required
                />
              </div>
              <div>
                <label>Closing Time (Minutes after closing)</label>
                <input
                  type="number"
                  id="closing_time_minutes"
                  value="30"
                  required
                />
              </div>
            </div>

            <button type="submit" class="btn-primary">Add Branch</button>
          </form>
          <div
            id="message"
            style="margin-top: 10px; color: green; font-weight: bold"
          ></div>
        </div>

        <!-- LIST: Branches -->
        <h3>📋 List of Branches</h3>
        <div id="branch-list">
          <p>Loading branches...</p>
        </div>
      </main>
    </div>

    <script>
      const API_URL = "http://127.0.0.1:8000";
      const token = localStorage.getItem("access_token");
      const user = JSON.parse(localStorage.getItem("user"));

      if (!token || !user) window.location.href = "index.html";

      document.getElementById("userName").textContent = user.full_name;
      document.getElementById("userRole").textContent = user.role;
      document.getElementById("topBarName").textContent = user.full_name;

      // FETCH BRANCHES
      async function fetchBranches() {
        const container = document.getElementById("branch-list");
        try {
          const response = await fetch(`${API_URL}/branches/`, {
            headers: { Authorization: `Bearer ${token}` },
          });
          const data = await response.json();

          if (data.length === 0) {
            container.innerHTML =
              "<p style='color:#666;'>No branches yet. Add one above!</p>";
            return;
          }

          let html = `<table class="branch-table">
            <thead><tr><th>ID</th><th>Branch Name</th><th>Operating Hours</th><th>Prep Time</th><th>Closing Time</th></tr></thead><tbody>`;

          data.forEach((b) => {
            // Pormatuhin ang oras (e.g. 08:00:00 -> 08:00 AM)
            const open = b.opening_time.substring(0, 5);
            const close = b.closing_time.substring(0, 5);

            html += `<tr>
              <td>${b.id}</td>
              <td><strong>${b.name}</strong></td>
              <td>${open} - ${close}</td>
              <td>${b.prep_time_minutes} mins</td>
              <td>${b.closing_time_minutes} mins</td>
            </tr>`;
          });
          html += `</tbody></table>`;
          container.innerHTML = html;
        } catch (error) {
          container.innerHTML = `<p style="color:red;">❌ Error: ${error.message}</p>`;
        }
      }

      // SUBMIT BRANCH
      document
        .getElementById("branchForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const msgBox = document.getElementById("message");

          // Nagdadagdag tayo ng ":00" para maging HH:MM:SS ang format
          const payload = {
            name: document.getElementById("branch_name").value,
            opening_time: document.getElementById("opening_time").value + ":00",
            closing_time: document.getElementById("closing_time").value + ":00",
            prep_time_minutes: parseInt(
              document.getElementById("prep_time_minutes").value,
            ),
            closing_time_minutes: parseInt(
              document.getElementById("closing_time_minutes").value,
            ),
          };

          try {
            const response = await fetch(`${API_URL}/branches/`, {
              method: "POST",
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify(payload),
            });
            const data = await response.json();

            if (response.ok) {
              msgBox.textContent = "✅ Branch added successfully!";
              document.getElementById("branchForm").reset();
              fetchBranches(); // I-refresh ang listahan
            } else {
              msgBox.textContent =
                "❌ Error: " + (data.detail || "Failed to add branch");
              msgBox.style.color = "red";
            }
          } catch (error) {
            msgBox.textContent = "❌ Error: " + error.message;
            msgBox.style.color = "red";
          }
        });

      function logout() {
        localStorage.removeItem("access_token");
        localStorage.removeItem("user");
        window.location.href = "index.html";
      }

      fetchBranches();
    </script>
  </body>
</html>
